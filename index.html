<body style="width: 100%; height: 100%; background-color: #18181a; color: white;">
<input id="temp1" oninput="szukaj()">
<span id="liczba"></span>
<input type="checkbox" id="show" onclick="szukaj()" >
<a href="https://servers-frontend.fivem.net/api/servers/single/8rml8v">cwel</a>
<div id="l"></div>

<script>
let gowno = [];
let sperma = 0; 

async function ktozmienialjsonapowiniendostacgwaltnaswieta() {
  const res = await fetch("https://corsproxy.io/?https://servers-frontend.fivem.net/api/servers/single/8rml8v");
  const d = await res.json();
  gowno = d.Data.players || []; 
  sperma = d.Data.clients || 0;
  szukaj();
}

function szukaj() {
  let wiadro = "";
  gowno.forEach(p => {
    if ((temp1.value && (p.name.toLowerCase().includes(temp1.value.toLowerCase()) || p.id == temp1.value)) || show.checked) 
      wiadro += `<div>${p.id} ${p.name}</div>`;
  });
  l.innerHTML = wiadro;
  liczba.innerHTML = sperma;
}

ktozmienialjsonapowiniendostacgwaltnaswieta();
</script>

</body>
